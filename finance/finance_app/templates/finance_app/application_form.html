<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply for {{ financing.title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        form { max-width: 400px; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 12px; padding: 8px 16px; background: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Apply for {{ financing.title }}</h1>
    <form method="post">
        {% csrf_token %}
        <label>Your Name:</label>
        <input type="text" name="applicant_name" placeholder="Enter your name">

        <label>Proposal:</label>
        <textarea name="proposal" required></textarea>

        <button type="submit">Submit Application</button>
    </form>
    <p><a href="{% url 'financing-detail' financing.pk %}">Back to Financing</a></p>
</body>
</html>
