<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Financing List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
        a { color: #007BFF; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .button { padding: 6px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none;}
        .button:hover { background: #218838; }
    </style>
</head>
<body>
    <h1>Financing List</h1>
    <a class="button" href="{% url 'financing-create' %}">Add New Financing</a>
    <table>
        <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Investor</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        {% for f in financings %}
        <tr>
            <td>{{ f.title }}</td>
            <td>{{ f.amount }}</td>
            <td>{{ f.investor_name }}</td>
            <td>{{ f.status }}</td>
            <td>
                <a href="{% url 'financing-detail' f.pk %}">View</a> |
                <a href="{% url 'financing-update' f.pk %}">Edit</a> |
                <a href="{% url 'application-create' f.pk %}">Apply</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No financings available.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
