<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if financing %}Edit{% else %}Add{% endif %} Financing</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        form { max-width: 400px; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 12px; padding: 8px 16px; background: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>{% if financing %}Edit{% else %}Add{% endif %} Financing</h1>
    <form method="post">
        {% csrf_token %}
        <label>Title:</label>
        <input type="text" name="title" value="{{ financing.title|default:'' }}" required>

        <label>Description:</label>
        <textarea name="description" required>{{ financing.description|default:'' }}</textarea>

        <label>Amount:</label>
        <input type="number" step="0.01" name="amount" value="{{ financing.amount|default:'' }}" required>

        <label>Deadline:</label>
        <input type="datetime-local" name="deadline" value="{{ financing.deadline|date:'Y-m-d\TH:i' }}" required>

        <label>Investor Name:</label>
        <input type="text" name="investor_name" value="{{ financing.investor_name|default:'' }}">

        <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'financing-list' %}">Back to List</a></p>
</body>
</html>
